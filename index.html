<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spending">
<meta name="theme-color" content="#e8e8e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Spending</title>
<style>
  :root {
    --bg: #e8e8e3; --tile: #f6f6f2; --text: #121212; --muted: #6b6b64; --line: #d4d4cc;
    --dot-off: #dfdfd8; --dot-on: #121212; --red: #d7261e; --green: #1f8f45; --grid: rgba(0,0,0,.08);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --tile: #0e0e0e; --text: #ededed; --muted: #808080; --line: #242424;
      --dot-off: #1e1e1e; --dot-on: #f2f2f2; --red: #ff3b30; --green: #30d158; --grid: rgba(255,255,255,.07);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0 auto; max-width: 560px; color: var(--text); font: 15px/1.35 var(--mono);
    background: var(--bg) radial-gradient(circle, var(--grid) 1px, transparent 1.6px) 0 0 / 12px 12px;
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px)
             calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 14px);
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* dot-matrix rendering */
  .dots { display: block; }
  .dots .off { fill: var(--dot-off); }
  .dots .on  { fill: var(--dot-on); }
  .dots .red { fill: var(--red); }
  .dots .grn { fill: var(--green); }
  #hero.ok .lbl i { background: var(--green); }
  .over .dots .on { fill: var(--red); }

  /* LED boot-up: lit dots switch on column by column with a quick flicker */
  #big, #meter { --lit: var(--dot-on); }
  #big.over, .boot .red { --lit: var(--red); }
  @keyframes led { 0% { fill: var(--dot-off); } 45% { fill: var(--lit); } 62% { fill: var(--dot-off); } 100% { fill: var(--lit); } }
  .boot .on, .boot .red { animation: led .24s linear backwards; }

  header { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin: 2px 0 12px; }
  #monthbtn { display: flex; align-items: center; gap: 12px; padding: 10px 4px 10px 2px; }
  #month svg { height: 22px; width: auto; }
  #caret svg { width: 18px; height: auto; transition: transform .2s; }
  #monthbtn[aria-expanded=true] #caret svg { transform: rotate(180deg); }
  .chip { border: 1px solid var(--line); background: var(--tile); border-radius: 999px; padding: 10px 14px;
          font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }

  #picker { margin: 0 0 10px; }
  .years { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .years button { font-size: 12px; font-weight: 600; letter-spacing: .12em; padding: 7px 13px;
                  border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .years button.sel { color: var(--text); border-color: var(--text); }
  .months { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mt { border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 11px; text-align: left;
        display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .mt .mn { font-size: 11px; font-weight: 600; letter-spacing: .14em; }
  .mt .ms { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mt .dots { width: 100%; height: auto; }
  .mt.sel { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
  .mt.now { background: var(--text); color: var(--bg); border-color: var(--text); }
  .mt.now .dots .on { fill: var(--bg); }
  .mt.now .dots .off { fill: rgba(128,128,128,.4); }
  .mt:disabled { opacity: .35; cursor: default; }

  .datarow { margin-top: 12px; }
  .ghost { border: 1px solid var(--line); border-radius: 12px; min-height: 46px; font-size: 12px; font-weight: 600;
           letter-spacing: .16em; text-transform: uppercase; }
  .ghost:active { background: var(--text); color: var(--bg); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--tile); border: 1px solid var(--line); border-radius: 22px; padding: 14px 16px 16px;
          min-width: 0; }
  .span { grid-column: 1 / -1; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
         display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .lbl i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-right: 8px;
           vertical-align: 1px; }
  .small { display: flex; flex-direction: column; justify-content: space-between; min-height: 112px; text-align: left; }
  .val { font-size: 24px; font-weight: 500; letter-spacing: -.03em; font-variant-numeric: tabular-nums;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .val.red { color: var(--red); }
  .hint { font-size: 10px; letter-spacing: .14em; color: var(--muted); }
  .daysrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  #cal svg { width: 58px; height: auto; }

  #hero { display: block; width: 100%; text-align: left; }
  #big svg { width: 100%; height: auto; margin: 18px 0 14px; }
  #meter svg { width: 100%; height: auto; }

  form { display: grid; gap: 10px; }
  .typerow { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input {
    font: 500 16px var(--mono); color: var(--text); background: transparent; border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; min-height: 46px;
    -webkit-appearance: none; appearance: none;
  }
  input::placeholder { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }
  input:focus { outline: none; border-color: var(--text); }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  .add { background: var(--text); color: var(--bg); font-weight: 700; font-size: 13px; letter-spacing: .2em;
         border-radius: 12px; min-height: 48px; text-transform: uppercase; }
  .add:active { opacity: .75; }

  .icon { width: 40px; height: 40px; flex: none; padding: 6px; border-radius: 11px; background: var(--bg);
          border: 1px solid var(--line); }
  .icon svg { width: 100%; height: 100%; }

  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
  li:first-child { border-top: 0; }
  .what { flex: 1; min-width: 0; }
  .type { font-weight: 500; text-transform: uppercase; letter-spacing: .04em;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .date { color: var(--muted); font-size: 11px; letter-spacing: .1em; margin-top: 2px; }
  .amt { font-variant-numeric: tabular-nums; font-weight: 500; }
  .del { color: var(--muted); font-size: 20px; width: 34px; height: 40px; flex: none; }
  [hidden] { display: none !important; }
  #plantoggle { width: 100%; padding: 2px 0; }
  .plansum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .plansum .k { font-size: 10px; letter-spacing: .14em; color: var(--muted); }
  .plansum .v { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 4px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plansum .v.red { color: var(--red); }
  .sect { font-size: 10px; letter-spacing: .14em; color: var(--muted); margin: 22px 0 0;
          display: flex; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .edit { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; }
  .addline { display: grid; grid-template-columns: 1fr 104px 46px; gap: 8px; margin-top: 8px; }
  .addline button { border: 1px solid var(--line); border-radius: 12px; font-size: 20px; }
  .addline button:active { background: var(--text); color: var(--bg); }
  .plannote { font-size: 11px; color: var(--muted); letter-spacing: .03em; line-height: 1.5; margin: 16px 0 0; }
  #empty { color: var(--muted); font-size: 11px; letter-spacing: .14em; padding: 18px 0 4px; text-align: center; }
</style>
</head>
<body>
<header>
  <button id="monthbtn" aria-expanded="false" aria-controls="picker">
    <span id="month" role="heading" aria-level="1"></span><span id="caret"></span>
  </button>
  <button id="nowbtn" class="chip" hidden>This month</button>
</header>

<section id="picker" class="tile" hidden>
  <div id="years" class="years"></div>
  <div id="months" class="months"></div>
</section>

<main class="grid">
  <button id="hero" class="tile span">
    <div class="lbl"><span><i></i>Remaining</span><span id="pct"></span></div>
    <div id="big"></div>
    <div id="meter"></div>
  </button>

  <div class="tile small">
    <div class="lbl">Spent</div>
    <div id="spentv" class="val"></div>
  </div>
  <button id="budgetbtn" class="tile small">
    <div class="lbl"><span>Budget</span><span class="hint">PLAN</span></div>
    <div id="budgetv" class="val"></div>
  </button>
  <div class="tile small">
    <div class="lbl">Days left</div>
    <div class="daysrow"><div id="daysv" class="val"></div><div id="cal"></div></div>
  </div>
  <div class="tile small">
    <div class="lbl">Per day</div>
    <div id="perdayv" class="val"></div>
  </div>

  <section id="plan" class="tile span">
    <button id="plantoggle" class="lbl" aria-expanded="false" aria-controls="planedit">
      <span>Monthly plan</span><span id="planhint" class="hint">EDIT</span>
    </button>
    <div class="plansum">
      <div><div class="k">INCOME</div><div id="inv" class="v"></div></div>
      <div><div class="k">FIXED</div><div id="outv" class="v"></div></div>
      <div><div class="k">AVAILABLE</div><div id="availv" class="v"></div></div>
    </div>
    <div id="planedit" hidden>
      <div class="sect"><span>INCOME</span><span id="incTotal"></span></div>
      <ul id="incList"></ul>
      <form class="addline" data-kind="income" autocomplete="off">
        <input name="label" placeholder="Source" enterkeyhint="next" required>
        <input name="amt" inputmode="decimal" placeholder="Amount" enterkeyhint="done" required>
        <button aria-label="Add income">+</button>
      </form>
      <div class="sect"><span>FIXED EXPENSES</span><span id="expTotal"></span></div>
      <ul id="expList"></ul>
      <form class="addline" data-kind="expenses" autocomplete="off">
        <input name="label" placeholder="Expense" enterkeyhint="next" required>
        <input name="amt" inputmode="decimal" placeholder="Amount" enterkeyhint="done" required>
        <button aria-label="Add fixed expense">+</button>
      </form>
      <p id="plannote" class="plannote"></p>
    </div>
  </section>

  <form id="add" class="tile span" autocomplete="off">
    <div class="lbl">New entry</div>
    <div class="typerow">
      <div id="preview" class="icon"></div>
      <input id="type" list="types" placeholder="Item type" enterkeyhint="next" required>
    </div>
    <datalist id="types"></datalist>
    <div class="row">
      <input id="cost" inputmode="decimal" placeholder="Cost" enterkeyhint="done" required>
      <input id="date" type="date" required>
    </div>
    <button type="submit" class="add">Add entry +</button>
  </form>

  <section class="tile span">
    <div class="lbl"><span>Log</span><span id="count"></span></div>
    <ul id="list"></ul>
    <div id="empty">NO ENTRIES</div>
  </section>

  <section class="tile span">
    <div class="lbl">Data</div>
    <div class="row datarow">
      <button id="backupbtn" class="ghost">Backup</button>
      <button id="restorebtn" class="ghost">Restore</button>
    </div>
    <p class="plannote">Backup gives you a code to save somewhere safe, like Notes. Restore replaces everything in the app with a saved code.</p>
  </section>
</main>

<script>
// Change this to your currency symbol.
const CURRENCY = '$';

const KEY = 'spending-v1';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const thisMonth = () => todayStr().slice(0, 7);
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

/* ---------- 5x7 dot-matrix font ---------- */
const FONT_SRC = {
  '0':'01110 10001 10011 10101 11001 10001 01110', '1':'00100 01100 00100 00100 00100 00100 01110',
  '2':'01110 10001 00001 00010 00100 01000 11111', '3':'11111 00010 00100 00010 00001 10001 01110',
  '4':'00010 00110 01010 10010 11111 00010 00010', '5':'11111 10000 11110 00001 00001 10001 01110',
  '6':'00110 01000 10000 11110 10001 10001 01110', '7':'11111 00001 00010 00100 01000 01000 01000',
  '8':'01110 10001 10001 01110 10001 10001 01110', '9':'01110 10001 10001 01111 00001 00010 01100',
  'A':'01110 10001 10001 11111 10001 10001 10001', 'B':'11110 10001 10001 11110 10001 10001 11110',
  'C':'01110 10001 10000 10000 10000 10001 01110', 'D':'11100 10010 10001 10001 10001 10010 11100',
  'E':'11111 10000 10000 11110 10000 10000 11111', 'F':'11111 10000 10000 11110 10000 10000 10000',
  'G':'01110 10001 10000 10111 10001 10001 01111', 'H':'10001 10001 10001 11111 10001 10001 10001',
  'I':'01110 00100 00100 00100 00100 00100 01110', 'J':'00111 00010 00010 00010 00010 10010 01100',
  'K':'10001 10010 10100 11000 10100 10010 10001', 'L':'10000 10000 10000 10000 10000 10000 11111',
  'M':'10001 11011 10101 10101 10001 10001 10001', 'N':'10001 10001 11001 10101 10011 10001 10001',
  'O':'01110 10001 10001 10001 10001 10001 01110', 'P':'11110 10001 10001 11110 10000 10000 10000',
  'Q':'01110 10001 10001 10001 10101 10010 01101', 'R':'11110 10001 10001 11110 10100 10010 10001',
  'S':'01111 10000 10000 01110 00001 00001 11110', 'T':'11111 00100 00100 00100 00100 00100 00100',
  'U':'10001 10001 10001 10001 10001 10001 01110', 'V':'10001 10001 10001 10001 10001 01010 00100',
  'W':'10001 10001 10001 10101 10101 10101 01010', 'X':'10001 10001 01010 00100 01010 10001 10001',
  'Y':'10001 10001 10001 01010 00100 00100 00100', 'Z':'11111 00001 00010 00100 01000 10000 11111',
  '$':'00100 01111 10100 01110 00101 11110 00100', '-':'0000 0000 0000 1111 0000 0000 0000',
  '.':'00 00 00 00 00 11 11', ',':'00 00 00 00 00 01 10', ' ':'000 000 000 000 000 000 000',
};
const FONT = Object.fromEntries(Object.entries(FONT_SRC).map(([k, v]) =>
  [k, v.split(' ').map(r => r.replace(/1/g, '#').replace(/0/g, '.'))]));

// Rows of characters -> SVG. '#' lit, 'r' red, '.' unlit, ' ' nothing.
function dots(rows) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  let s = `<svg class="dots" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
  rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) {
      const c = r[x];
      if (c === ' ') continue;
      s += `<circle cx="${x + .5}" cy="${y + .5}" r=".4" class="${c === '#' ? 'on' : c === 'r' ? 'red' : c === 'g' ? 'grn' : 'off'}"/>`;
    }
  });
  return s + '</svg>';
}
// minW: total width in dots; narrower text is right-aligned (keeps digits steady while rolling).
function textRows(str, padX = 1, padY = 1, minW = 0) {
  const glyphs = [...String(str).toUpperCase()].map(ch => FONT[ch === '−' ? '-' : ch] || FONT[' ']);
  const rows = Array.from({ length: 7 }, (_, y) => glyphs.map(g => g[y]).join('.'));
  const extra = Math.max(0, minW - rows[0].length - 2 * padX);
  const lpad = '.'.repeat(padX + extra), rpad = '.'.repeat(padX);
  const blank = '.'.repeat(rows[0].length + 2 * padX + extra);
  return [...Array(padY).fill(blank), ...rows.map(r => lpad + r + rpad), ...Array(padY).fill(blank)];
}

/* ---------- 9x9 item icons, picked automatically from the item type ---------- */
const ICONS = {
  food:   ['.........','..#####..','.#######.','#########','.........','#########','.........','#########','.#######.'],
  coffee: ['.#..#....','..#..#...','.#..#....','.........','#######..','#.....###','#.....#.#','#.....###','.#####...'],
  drinks: ['.#####...','#######..','#.....###','#.#.#.#.#','#.#.#.#.#','#.#.#.###','#.#.#.#..','#.....#..','#######..'],
  cart:   ['##.......','.#.......','.#######.','.#.....#.','.#.....#.','.#######.','.#.......','.######..','..#...#..'],
  bag:    ['...###...','..#...#..','..#...#..','#########','#########','#########','#########','#########','#########'],
  car:    ['.........','..#####..','.#..#..#.','#########','#########','#########','.##...##.','.##...##.','.........'],
  movie:  ['#.#.#.#.#','#########','#.......#','#..#....#','#..##...#','#..###..#','#..##...#','#..#....#','#########'],
  game:   ['.........','.#######.','##.###.##','#...#.#.#','##.###.##','#########','###...###','##.....##','.........'],
  shirt:  ['..##.##..','.#######.','#########','#.#####.#','..#####..','..#####..','..#####..','..#####..','.........'],
  health: ['.........','...###...','...###...','.#######.','.#######.','.#######.','...###...','...###...','.........'],
  fitness:['.........','.........','##.....##','##.....##','#########','##.....##','##.....##','.........','.........'],
  tech:   ['.........','..#####..','.#.....#.','#.......#','#.......#','###...###','###...###','###...###','.........'],
  code:   ['#########','#.......#','#.#.....#','#..#....#','#.#.###.#','#.......#','#########','...###...','.#######.'],
  home:   ['....#....','...###...','..#####..','.#######.','#########','.#######.','.##...##.','.##...##.','.##...##.'],
  bolt:   ['.....##..','....##...','...##....','..######.','.....##..','....##...','...##....','..##.....','.#.......'],
  cloud:  ['...###...','.##...##.','#.......#','#.......#','.###.###.','....#....','..#.#.#..','...###...','....#....'],
  ticket: ['.........','#########','#####.###','#########','.####.##.','#########','#####.###','#########','.........'],
  income: ['....#....','...###...','..#.#.#..','.#..#..#.','....#....','....#....','....#....','....#....','.........'],
  blank:  Array(9).fill('.........'),
};
// First match wins, so more specific rules come first.
const RULES = [
  ['bolt',    /electric|power bill|utilit|internet|wi-?fi|spectrum|comcast|xfinity|verizon|at&t|t-mobile|phone bill|water bill|gas bill/],
  ['coffee',  /coffee|latte|espresso|caf[eé]|starbucks|dunkin|\btea\b|boba/],
  ['drinks',  /beer|\bbars?\b|wine|drinks?\b|cocktail|liquor|\bpub\b|brewery/],
  ['cart',    /grocer|supermarket|aldi|trader joe|whole foods|kroger|costco|wegmans|publix|safeway|market/],
  ['health',  /pharm|\bcvs\b|walgreens|doctor|dentist|dental|medic|health|hospital|clinic|copay|prescription|\bpt\b|therap|wart|skin|derm|vitamin|\bpills?\b|urgent care|optom|glasses|contacts|\bhims\b|\bhers\b|nurx|teladoc|goodrx/],
  ['fitness', /\bgym\b|fitness|yoga|climb|workout|protein|peloton|pilates/],
  ['ticket',  /ticket|concert|festival|\bshows?\b|\bgig\b|stubhub|ticketmaster|seatgeek|eventbrite|\baxs\b|museum/],
  ['game',    /game|\bgta\b|steam|xbox|playstation|\bps[45]\b|nintendo|arcade/],
  ['movie',   /movie|cinema|film|theat(er|re)|netflix|hulu|disney|hbo/],
  ['food',    /food|diner|lunch|dinner|breakfast|brunch|restaurant|pizza|burger|taco|sushi|take-?out|doordash|uber ?eats|grubhub|chipotle|mcdonald|snack|\beat|bagel|sandwich|ramen|wings/],
  ['shirt',   /shirt|costume|cloth|dress|pants|jeans|shoes?\b|sneaker|jacket|hoodie|socks?\b|apparel|uniqlo|zara|h&m/],
  ['cloud',   /torbox|real-?debrid|google ?one|google storage|cloud|dropbox|onedrive|backblaze|\bvpn\b|mullvad|proton/],
  ['code',    /claude|chatgpt|openai|subscription|software|\bapps?\b|adobe|github|domain|hosting|patreon|youtube/],
  ['tech',    /headphone|airpods|earbud|speaker|audio|music|spotify|cable|charger|phone|laptop|computer|\btech\b|electronic|keyboard|mouse|monitor/],
  ['car',     /\bgas\b|fuel|uber|lyft|taxi|\bcar\b|parking|toll|tires?\b|oil change|mechanic|transit|metro|subway|\bbus\b|train|registration/],
  ['home',    /\brent\b|mortgage|home|furniture|decor|apartment|clean|laundry|insurance|hardware|lowe'?s/],
  ['bag',     /target|amazon|walmart|shop|store|mall|ikea|best buy|gift|order/],
];
const iconCache = new Map();
function iconFor(type) {
  const s = type.toLowerCase().trim();
  if (iconCache.has(s)) return iconCache.get(s);
  let rows = null;
  for (const [k, re] of RULES) if (re.test(s)) { rows = ICONS[k]; break; }
  if (!rows) {
    // No match: show the item's first letter.
    const ch = (s.match(/[a-z0-9]/) || [])[0];
    rows = ICONS.blank;
    if (ch) {
      const g = FONT[ch.toUpperCase()], grid = ICONS.blank.map(r => r.split(''));
      g.forEach((line, y) => [...line].forEach((c, x) => { if (c === '#') grid[y + 1][x + 2] = '#'; }));
      rows = grid.map(r => r.join(''));
    }
  }
  const svg = dots(rows);
  iconCache.set(s, svg);
  return svg;
}

/* ---------- data ----------
   Amounts are in cents.
   plan:  the recurring income / fixed expenses, carried into each new month.
   plans: "YYYY-MM" -> that month's own copy, so changing the plan later
          doesn't rewrite past months.
   budgets / defaultBudget: older manual budget, used only while the plan is empty. */
function emptyPlan() { return { income: [], expenses: [] }; }
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!d || !Array.isArray(d.entries)) d = { entries: [], budgets: {}, defaultBudget: null };
  d.budgets ??= {};
  d.plan ??= emptyPlan();
  d.plans ??= {};
  return d;
}
let db = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };
navigator.storage?.persist?.();

let view = thisMonth();

function money(c) {
  return (c < 0 ? '−' : '') + CURRENCY +
    (Math.abs(c) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function parseMoney(s) {
  s = String(s).trim();
  if (/,\d{1,2}$/.test(s) && !s.includes('.')) s = s.replace(',', '.'); // "12,50"
  s = s.replace(/[^\d.\-]/g, '');
  return Math.round(parseFloat(s) * 100);
}
function monthLabel(m) {
  const [y, mo] = m.split('-').map(Number);
  return new Date(y, mo - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
}
function dayLabel(s) {
  const [y, mo, d] = s.split('-').map(Number);
  return `${DOW[new Date(y, mo - 1, d).getDay()]} ${pad(d)} ${MON[mo - 1]}`;
}
const clone = o => JSON.parse(JSON.stringify(o));
const total = list => list.reduce((s, x) => s + x.amount, 0);
const hasItems = p => !!p && (p.income.length > 0 || p.expenses.length > 0);
const planFor = m => db.plans[m] || (hasItems(db.plan) ? db.plan : null);
function budgetFor(m) {
  const p = planFor(m);
  if (hasItems(p)) return total(p.income) - total(p.expenses);
  return m in db.budgets ? db.budgets[m] : db.defaultBudget;
}
// Edits in the current month update the recurring plan (and so every later month);
// edits while viewing a past month change only that month.
function mutatePlan(fn) {
  const cur = thisMonth();
  if (view === cur) { fn(db.plan); db.plans[cur] = clone(db.plan); }
  else { db.plans[view] ??= clone(planFor(view) || emptyPlan()); fn(db.plans[view]); }
  save(); render();
}

function meter(frac, over) {
  const N = 40, n = over ? N : Math.round(Math.min(1, Math.max(0, frac)) * N);
  const row = (over ? 'r' : '#').repeat(n) + '.'.repeat(N - n);
  $('meter').innerHTML = dots([row, row]);
}

/* ---------- hero animations ---------- */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
let heroShown = null;   // what the hero last showed: { view, left }
let rollRaf = 0;

function drawHero(left, budget, minW = 0) {
  $('big').innerHTML = dots(textRows(money(left), 1, 1, minW));
  $('big').className = left < 0 ? 'over' : '';
  const spent = budget - left;
  const frac = budget > 0 ? spent / budget : (spent > 0 ? 1 : 0);
  $('pct').textContent = `${Math.round(frac * 100)}% USED`;
  meter(frac, left < 0);
}

// Countdown roll: when the remaining amount changes within the same month,
// count from the old value to the new one instead of jumping.
function showHero(left, budget) {
  cancelAnimationFrame(rollRaf);
  const prev = heroShown;
  heroShown = { view, left };
  if (!prev || prev.view !== view || prev.left == null || prev.left === left || reduceMotion.matches) {
    drawHero(left, budget);
    return;
  }
  const from = prev.left, to = left;
  const width = s => textRows(s, 0, 0)[0].length;
  const minW = Math.max(width(money(from)), width(money(to))) + 2;
  const dur = Math.min(1400, 600 + Math.abs(to - from) / 100 * 3); // bigger changes roll a little longer
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    if (t >= 1) { drawHero(to, budget); return; }
    const eased = 1 - Math.pow(1 - t, 3);
    drawHero(Math.round(from + (to - from) * eased), budget, minW);
    rollRaf = requestAnimationFrame(step);
  };
  rollRaf = requestAnimationFrame(step);
}

// LED boot-up: light the big number column by column, then sweep the meter.
let bootTimer = 0;
function boot() {
  if (reduceMotion.matches) return;
  clearTimeout(bootTimer);
  const parts = [[$('big'), 0, 16], [$('meter'), 260, 9]];  // [element, start ms, ms per column]
  for (const [el, start, per] of parts) {
    el.classList.remove('boot');
    el.querySelectorAll('circle.on, circle.red').forEach(c => {
      c.style.animationDelay = `${start + parseFloat(c.getAttribute('cx')) * per}ms`;
    });
    void el.offsetWidth; // restart the animation
    el.classList.add('boot');
  }
  bootTimer = setTimeout(() => parts.forEach(([el]) => el.classList.remove('boot')), 1600);
}

function render() {
  const cur = thisMonth();
  // Lock in the current month's budget so later changes don't rewrite history.
  if (view === cur && !(cur in db.budgets) && db.defaultBudget != null) { db.budgets[cur] = db.defaultBudget; save(); }
  if (view === cur && !db.plans[cur] && hasItems(db.plan)) { db.plans[cur] = clone(db.plan); save(); }

  const [y, mo] = view.split('-').map(Number);
  $('month').innerHTML = dots(textRows(`${MON[mo - 1]} ${y}`, 0, 0));
  $('month').setAttribute('aria-label', monthLabel(view));
  $('nowbtn').hidden = view === cur;
  if (!$('picker').hidden) renderPicker();

  const items = db.entries.filter(e => e.date.startsWith(view))
    .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  const spent = items.reduce((s, e) => s + e.cost, 0);
  const budget = budgetFor(view);
  const left = budget == null ? null : budget - spent;

  // Hero: remaining, in dot-matrix
  if (budget == null) {
    cancelAnimationFrame(rollRaf);
    heroShown = { view, left: null };
    $('big').innerHTML = dots(textRows('SET BUDGET'));
    $('big').className = '';
    $('pct').textContent = 'TAP';
    meter(0, false);
  } else {
    showHero(left, budget);
  }
  $('hero').setAttribute('aria-label', budget == null ? 'Set monthly budget' : `${money(left)} left`);

  $('spentv').textContent = money(spent);
  $('budgetv').textContent = budget == null ? '—' : money(budget);

  // Days left + mini calendar (elapsed days lit, today red)
  const dim = new Date(y, mo, 0).getDate(), isCur = view === cur, today = new Date().getDate();
  const daysLeft = isCur ? dim - today + 1 : 0;
  $('daysv').textContent = String(daysLeft);
  let cal = '';
  // Status colour: green while there's budget left, red at/over zero (or no budget yet).
  const ok = left != null && left > 0;
  $('hero').classList.toggle('ok', ok);
  for (let d = 1; d <= dim; d++) cal += !isCur || d < today ? '#' : d === today ? (ok ? 'g' : 'r') : '.';
  $('cal').innerHTML = dots(cal.match(/.{1,7}/g).map(r => r.padEnd(7, ' ')));

  const pv = $('perdayv');
  if (isCur && left != null) {
    pv.textContent = money(Math.max(0, Math.floor(left / daysLeft)));
    pv.className = 'val' + (left < 0 ? ' red' : '');
  } else { pv.textContent = '—'; pv.className = 'val'; }

  // Log
  $('count').textContent = `${items.length} ITEM${items.length === 1 ? '' : 'S'}`;
  $('list').replaceChildren(...items.map(e => {
    const li = document.createElement('li');
    const ic = document.createElement('div'); ic.className = 'icon'; ic.innerHTML = iconFor(e.type);
    const what = document.createElement('div'); what.className = 'what';
    const t = document.createElement('div'); t.className = 'type'; t.textContent = e.type;
    const d = document.createElement('div'); d.className = 'date'; d.textContent = dayLabel(e.date);
    what.append(t, d);
    const a = document.createElement('div'); a.className = 'amt'; a.textContent = money(e.cost);
    const x = document.createElement('button'); x.className = 'del'; x.textContent = '×';
    x.setAttribute('aria-label', `Delete ${e.type}`);
    x.onclick = () => {
      if (!confirm(`Delete ${e.type} (${money(e.cost)})?`)) return;
      db.entries = db.entries.filter(z => z.id !== e.id); save(); render();
    };
    li.append(ic, what, a, x);
    return li;
  }));
  $('empty').style.display = items.length ? 'none' : '';

  // Suggest previously used item types, most recent first.
  const seen = new Set();
  [...db.entries].sort((a, b) => b.id - a.id).forEach(e => seen.add(e.type));
  $('types').replaceChildren(...[...seen].slice(0, 40).map(v => { const o = document.createElement('option'); o.value = v; return o; }));

  $('date').value = isCur ? todayStr() : `${view}-01`;
  $('preview').innerHTML = iconFor($('type').value);
  renderPlan();
}

/* ---------- monthly plan (income − fixed expenses = budget) ---------- */
function renderPlan() {
  const p = planFor(view) || emptyPlan();
  const inc = total(p.income), exp = total(p.expenses), any = hasItems(p);
  $('inv').textContent = any ? money(inc) : '—';
  $('outv').textContent = any ? money(exp) : '—';
  const av = $('availv');
  av.textContent = any ? money(inc - exp) : '—';
  av.className = 'v' + (any && inc < exp ? ' red' : '');
  $('incTotal').textContent = money(inc);
  $('expTotal').textContent = money(exp);
  $('incList').replaceChildren(...p.income.map(it => planRow(it, 'income')));
  $('expList').replaceChildren(...p.expenses.map(it => planRow(it, 'expenses')));
  $('plannote').textContent = view === thisMonth()
    ? 'Carries over to every new month. Available = income − fixed expenses, and becomes your budget. Tap an amount to change it. To set money aside, add a "Savings" expense.'
    : `Changes here only affect ${monthLabel(view)}.`;
}
function planRow(it, kind) {
  const li = document.createElement('li');
  const b = document.createElement('button'); b.className = 'edit';
  const ic = document.createElement('div'); ic.className = 'icon';
  ic.innerHTML = kind === 'income' ? dots(ICONS.income) : iconFor(it.name);
  const what = document.createElement('div'); what.className = 'what';
  const t = document.createElement('div'); t.className = 'type'; t.textContent = it.name;
  what.append(t);
  const a = document.createElement('div'); a.className = 'amt'; a.textContent = money(it.amount);
  b.append(ic, what, a);
  b.setAttribute('aria-label', `Change ${it.name}, ${money(it.amount)} per month`);
  b.onclick = () => {
    const v = prompt(`${it.name} per month`, (it.amount / 100).toFixed(2));
    if (v === null) return;
    const c = parseMoney(v);
    if (!Number.isFinite(c) || c < 0) { alert('Please enter a number.'); return; }
    mutatePlan(p => { const x = p[kind].find(z => z.id === it.id); if (x) x.amount = c; });
  };
  const x = document.createElement('button'); x.className = 'del'; x.textContent = '×';
  x.setAttribute('aria-label', `Remove ${it.name}`);
  x.onclick = () => {
    if (!confirm(`Remove ${it.name}?`)) return;
    mutatePlan(p => { p[kind] = p[kind].filter(z => z.id !== it.id); });
  };
  li.append(b, x);
  return li;
}
document.querySelectorAll('.addline').forEach(f => f.addEventListener('submit', ev => {
  ev.preventDefault();
  const nameEl = f.querySelector('[name=label]'), amtEl = f.querySelector('[name=amt]');
  const name = nameEl.value.trim(), c = parseMoney(amtEl.value);
  if (!name) return nameEl.focus();
  if (!Number.isFinite(c) || c < 0) return amtEl.focus();
  mutatePlan(p => p[f.dataset.kind].push({ id: Date.now() + Math.random(), name, amount: c }));
  f.reset();
  nameEl.focus();
}));
function setPlanOpen(open) {
  $('planedit').hidden = !open;
  $('plantoggle').setAttribute('aria-expanded', String(open));
  $('planhint').textContent = open ? 'DONE' : 'EDIT';
}
function openPlan() { setPlanOpen(true); $('plan').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
$('plantoggle').onclick = () => setPlanOpen($('planedit').hidden);

$('budgetbtn').onclick = openPlan;
$('hero').onclick = () => { if (budgetFor(view) == null) openPlan(); };
/* ---------- month picker: the year as 12 tiles with spent + budget meter ---------- */
let pickYear = +thisMonth().slice(0, 4);
const shortMoney = c => (c < 0 ? '−' : '') + CURRENCY + Math.round(Math.abs(c) / 100).toLocaleString('en-US');
function pickerYears() {
  const ys = new Set([+thisMonth().slice(0, 4), pickYear]);
  db.entries.forEach(e => ys.add(+e.date.slice(0, 4)));
  Object.keys(db.plans).forEach(m => ys.add(+m.slice(0, 4)));
  return [...ys].sort((a, b) => a - b);
}
function renderPicker() {
  const cur = thisMonth();
  $('years').replaceChildren(...pickerYears().map(y => {
    const b = document.createElement('button');
    b.textContent = y; b.className = y === pickYear ? 'sel' : '';
    b.onclick = () => { pickYear = y; renderPicker(); };
    return b;
  }));
  $('months').replaceChildren(...MON.map((name, i) => {
    const m = `${pickYear}-${pad(i + 1)}`;
    const items = db.entries.filter(e => e.date.startsWith(m));
    const spent = items.reduce((s, e) => s + e.cost, 0);
    const future = m > cur && !items.length;
    const budget = future ? null : budgetFor(m);
    const over = budget != null && spent > budget;
    const N = 8;
    const lit = budget == null ? 0 : over ? N : Math.round(Math.min(1, budget > 0 ? spent / budget : 0) * N);
    const b = document.createElement('button');
    b.className = 'mt' + (m === cur ? ' now' : '') + (m === view ? ' sel' : '');
    b.disabled = future;
    const n = document.createElement('div'); n.className = 'mn'; n.textContent = name;
    const s = document.createElement('div'); s.className = 'ms';
    s.textContent = future ? '·' : items.length ? shortMoney(spent) : '—';
    const meter = document.createElement('div');
    meter.innerHTML = dots([(over ? 'r' : '#').repeat(lit) + '.'.repeat(N - lit)]);
    b.append(n, s, meter);
    b.setAttribute('aria-label', `${monthLabel(m)}, spent ${money(spent)}`);
    b.onclick = () => { view = m; setPicker(false); render(); boot(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    return b;
  }));
}
function setPicker(open) {
  $('picker').hidden = !open;
  $('monthbtn').setAttribute('aria-expanded', String(open));
  if (open) { pickYear = +view.slice(0, 4); renderPicker(); }
}
$('caret').innerHTML = dots(['#####', ' ### ', '  #  ']);
$('monthbtn').onclick = () => setPicker($('picker').hidden);
$('nowbtn').onclick = () => { view = thisMonth(); setPicker(false); render(); boot(); };

/* ---------- backup / restore ---------- */
const BACKUP_PREFIX = 'SPENDING1:';
function backupCode() {
  const json = JSON.stringify({ v: 1, at: new Date().toISOString(), db });
  return BACKUP_PREFIX + btoa(unescape(encodeURIComponent(json))); // base64 so Notes can't mangle quotes
}
$('backupbtn').onclick = async () => {
  const code = backupCode();
  if (navigator.share) {
    try { await navigator.share({ title: 'Spending backup', text: code }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(code); alert('Backup code copied. Paste it somewhere safe, like Notes.'); }
  catch { prompt('Copy this backup code:', code); }
};
$('restorebtn').onclick = () => {
  const raw = prompt('Paste your backup code');
  if (!raw) return;
  let data;
  try {
    const s = raw.replace(/\s+/g, '');
    if (!s.startsWith(BACKUP_PREFIX)) throw new Error();
    data = JSON.parse(decodeURIComponent(escape(atob(s.slice(BACKUP_PREFIX.length)))));
    if (!data.db || !Array.isArray(data.db.entries)) throw new Error();
  } catch { alert("That doesn't look like a Spending backup code."); return; }
  const when = data.at ? new Date(data.at).toLocaleString() : 'an unknown date';
  if (!confirm(`Replace everything in the app with the backup from ${when} (${data.db.entries.length} entries)?`)) return;
  db = data.db;
  db.budgets ??= {}; db.plan ??= emptyPlan(); db.plans ??= {};
  save();
  view = thisMonth();
  render();
  alert('Backup restored.');
};
$('type').addEventListener('input', () => { $('preview').innerHTML = iconFor($('type').value); });

$('add').addEventListener('submit', ev => {
  ev.preventDefault();
  const type = $('type').value.trim();
  const cost = parseMoney($('cost').value);
  if (!type) return $('type').focus();
  if (!Number.isFinite(cost) || cost === 0) return $('cost').focus();
  const date = $('date').value || todayStr();
  db.entries.push({ id: Date.now(), type, cost, date });
  save();
  view = date.slice(0, 7);
  $('type').value = ''; $('cost').value = '';
  document.activeElement?.blur();
  render();
});

// Roll over to the new month if the app is reopened after midnight.
// Replay the LED boot-up when coming back after a while (iOS often resumes the app instead of reloading it).
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  render();
  if (Date.now() - hiddenAt > 30000) boot();
});

render();
boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
